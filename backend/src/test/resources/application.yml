# 测试环境配置：使用 H2 内存数据库，避免依赖外部 MySQL
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# 关闭邮件发送，避免测试时连接 SMTP
  mail:
    host: localhost
    port: 25
    username: test
    password: test

# 关闭真实文件上传路径，测试使用临时目录
file:
  upload:
    path: ${java.io.tmpdir}/gzgd-uploads-test
    max-size: 10MB

# 百度人脸识别配置保留占位即可
baidu:
  face:
    app-id: "12345678"
    api-key: "test-key"
    secret-key: "test-secret"
    score-threshold: 80

# JWT 配置
jwt:
  secret: 12345678901234567890123456789012
  expiration: 86400000

# 验证码配置
captcha:
  expire: 300
  length: 6

# MyBatis-Plus 保持与主配置一致
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: edu.cdut.aiback.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j 在测试中关闭
knife4j:
  enable: false
