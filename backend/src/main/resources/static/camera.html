<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸拍照注册</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #102033;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #152033;
            padding: 20px;
        }

        .panel {
            width: min(520px, 100%);
            background: #f7f9fc;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
        }

        h1 {
            margin: 0 0 18px;
            font-size: 24px;
            font-weight: 650;
        }

        video, #preview img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 14px;
            background: #17283a;
            display: block;
        }

        video {
            transform: scaleX(-1);
        }

        .fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
        }

        label {
            display: grid;
            gap: 6px;
            color: #41546a;
            font-size: 13px;
        }

        input {
            height: 40px;
            border: 1px solid #c8d3df;
            border-radius: 10px;
            padding: 0 12px;
            font: inherit;
            background: white;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 14px 0;
        }

        button {
            height: 42px;
            border: 0;
            border-radius: 10px;
            font-weight: 650;
            cursor: pointer;
            color: #102033;
            background: #e3ebf3;
        }

        button.primary {
            background: #1f4f7a;
            color: white;
        }

        button:disabled {
            opacity: 0.48;
            cursor: not-allowed;
        }

        #preview {
            min-height: 120px;
            border: 1px dashed #b8c6d6;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #60758d;
            overflow: hidden;
            background: #edf3f8;
        }

        #status {
            margin-top: 12px;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            padding: 8px 12px;
            background: #e7eef6;
            color: #34506b;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
<main class="panel">
    <h1>人脸拍照注册</h1>
    <video id="video" autoplay playsinline></video>

    <div class="fields">
        <label>
            人脸库组 ID
            <input id="groupId" value="509">
        </label>
        <label>
            用户 ID
            <input id="userId" value="01">
        </label>
    </div>

    <div class="actions">
        <button id="startCamera">开启摄像头</button>
        <button id="capture" disabled>拍照</button>
        <button id="upload" class="primary" disabled>上传注册</button>
    </div>

    <div id="preview">等待拍照</div>
    <div id="status">先开启摄像头，然后拍照上传。</div>
</main>

<script>
    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const statusBox = document.getElementById('status');
    const startButton = document.getElementById('startCamera');
    const captureButton = document.getElementById('capture');
    const uploadButton = document.getElementById('upload');
    const groupIdInput = document.getElementById('groupId');
    const userIdInput = document.getElementById('userId');

    let stream = null;
    let currentBase64 = null;

    function setStatus(message) {
        statusBox.textContent = message;
    }

    async function startCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
            audio: false
        });
        video.srcObject = stream;
        captureButton.disabled = false;
        setStatus('摄像头已开启，可以拍照。');
    }

    function capturePhoto() {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        currentBase64 = canvas.toDataURL('image/jpeg', 0.92);
        preview.innerHTML = `<img src="${currentBase64}" alt="拍照预览">`;
        uploadButton.disabled = false;
        setStatus('已拍照，点击上传注册。');
    }

    async function uploadPhoto() {
        if (!currentBase64) {
            setStatus('还没有照片。');
            return;
        }
        const payload = {
            image: currentBase64,
            groupId: groupIdInput.value.trim(),
            userId: userIdInput.value.trim()
        };
        uploadButton.disabled = true;
        setStatus('正在上传到后端，再由后端注册到百度人脸库...');
        try {
            const response = await fetch('/faceregister', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            setStatus(data.success ? '注册成功。' : `注册失败：${data.errorMessage || data.rawResponse}`);
        } catch (error) {
            setStatus(`上传失败：${error.message}`);
        } finally {
            uploadButton.disabled = false;
        }
    }

    startButton.addEventListener('click', () => {
        startCamera().catch(error => setStatus(`摄像头启动失败：${error.message}`));
    });
    captureButton.addEventListener('click', capturePhoto);
    uploadButton.addEventListener('click', uploadPhoto);
    window.addEventListener('beforeunload', () => {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
    });
</script>
</body>
</html>
