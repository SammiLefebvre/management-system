server:
  port: 9090

spring:
  application:
    name: ai-back
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ========== 🆕 MySQL 数据源 ==========
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gzgd?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

  # ========== 原有邮件配置 ==========
  mail:
    host: smtp.qq.com
    port: 465
    username: 2749058417@qq.com
    password: arcksievfpnbdhac
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false

# ========== 🆕 MyBatis-Plus 配置 ==========
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: edu.cdut.aiback.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== 🆕 文件上传配置 ==========
file:
  upload:
    path: ./uploads
    max-size: 10MB

# ========== 百度人脸识别 ==========
baidu:
  face:
    app-id: "123790527"
    api-key: "aIdq9ZUf6neHkEhQ0k0zTBKX"
    secret-key: "sCe4zHD3qB8LoxINWybETCmpHSok72kC"
    score-threshold: 80

# ========== Hugging Face 配置（模型由系统指定，API Key 由前端请求时传入） ==========
huggingface:
  model: Qwen/Qwen2.5-7B-Instruct
  fallback-model: meta-llama/Llama-3.2-3B-Instruct
  endpoint: https://api-inference.huggingface.co/models/
  max-new-tokens: 512
  temperature: 0.7

# ========== JWT 配置 ==========
jwt:
  secret: 12345678901234567890123456789012
  expiration: 86400000          # 24小时（工单系统改为24小时）

# ========== 验证码配置 ==========
captcha:
  expire: 300
  length: 6

# ========== 🆕 Knife4j API 文档 ==========
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn
